  <rect width="300" height="400" fill="url(#scigrad)"/>
  <!-- Decorative Grid & Quantum Rings -->
  <circle cx="150" cy="170" r="80" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" fill="none"/>
